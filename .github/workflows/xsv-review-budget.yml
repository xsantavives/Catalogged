name: XSV Review Budget Gate
on:
  pull_request:
    paths:
      - '.github/review-budget/**'
      - '.github/workflows/xsv-review-budget.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Budget transition'
        required: true
        type: choice
        options: [status, reserve-review, finish-review, reserve-repair, finish-repair]
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      linear_issue:
        description: 'XSV-N authorized Linear issue'
        required: true
        type: string
      expected_sha:
        description: 'Expected current 40-hex PR HEAD'
        required: false
        type: string
      reservation_id:
        description: 'Reservation ID returned by reserve'
        required: false
        type: string
      review_id:
        description: 'Submitted GitHub PR review ID'
        required: false
        type: string
      verdict:
        description: 'Review verdict'
        required: false
        type: choice
        options: ['', ACCEPTED_FOR_OWNER_GATE, CHANGES_REQUESTED, BLOCKED_HUMAN_DECISION_REQUIRED]
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/review-budget -p 'test_*.py' -v
  gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: xsv-review-budget-${{ inputs.linear_issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate gate before any ledger mutation
        run: python -m unittest discover -s .github/review-budget -p 'test_*.py' -q
      - name: Apply serialized review-budget transition
        env:
          GH_TOKEN: ${{ github.token }}
          XSV_LEDGER_ISSUE: '30'
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          LINEAR_ISSUE: ${{ inputs.linear_issue }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RESERVATION_ID: ${{ inputs.reservation_id }}
          REVIEW_ID: ${{ inputs.review_id }}
          VERDICT: ${{ inputs.verdict }}
        run: |
          python .github/review-budget/review_budget.py \
            --operation "$OPERATION" --pr "$PR_NUMBER" \
            --linear-issue "$LINEAR_ISSUE" --sha "$EXPECTED_SHA" \
            --reservation-id "$RESERVATION_ID" --review-id "$REVIEW_ID" \
            --verdict "$VERDICT"
